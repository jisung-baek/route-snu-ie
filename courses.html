<main>
  <h1>개설 과목</h1>
  <p class="lede">향후 2년간 개설 예정 과목입니다. 학과 홈페이지 게시 자료(<span data-source-date="iso">2026-10-27</span>) 기준이며, 2년 전 계획이라 개설 여부는 해당 학기 직전 확정 자료로 확인하는 것이 가장 정확합니다.</p>

  <div class="ctools">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="courseSearch" type="search" data-ph-no-autocapture="true" placeholder="예: 데이터, 인간공학, 2026-1, 연합전공" aria-label="과목 검색">
    </label>
    <div class="frow"><span class="flabel">구분</span><div class="chips" id="courseTypes" role="group" aria-label="구분">
      <button class="chip filter" type="button" data-filter="all" aria-pressed="true">전체</button><button class="chip filter" type="button" data-filter="required" aria-pressed="false">전공필수</button><button class="chip filter" type="button" data-filter="elective" aria-pressed="false">전공선택</button><button class="chip filter" type="button" data-filter="graduate" aria-pressed="false">대학원</button>
    </div></div>
    <!-- 학기 버튼은 js/script.js의 initCourseFilters()가 데이터의 학기 목록에서 만듭니다 -->
    <div class="frow"><span class="flabel">학기</span><div class="chips" id="courseTerms" role="group" aria-label="학기"></div></div>
  </div>

  <p class="count" id="courseCount" aria-live="polite"></p>
  <div id="courseGrid"></div>
</main>
