<main>
  <h1>개설 과목</h1>
  <p class="lede">향후 2년간 개설 예정 과목입니다. 학과 홈페이지 게시 자료(<span id="srcDate">2026-10-27</span>) 기준이며, 2년 전 계획이라 개설 여부는 해당 학기 직전 확정 자료로 확인하는 것이 가장 정확합니다.</p>

  <div class="ctools">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="예: 데이터, 인간공학, 2026-1, 연합전공" aria-label="과목 검색">
    </label>
    <div class="frow"><span class="flabel">구분</span><div class="chips" id="types" role="group" aria-label="구분">
      <button class="chip" type="button" data-t="all" aria-pressed="true">전체</button><button class="chip" type="button" data-t="전필">전공필수</button><button class="chip" type="button" data-t="전선">전공선택</button><button class="chip" type="button" data-t="대학원">대학원</button>
    </div></div>
    <div class="frow"><span class="flabel">학기</span><div class="chips" id="terms" role="group" aria-label="학기"></div></div>
  </div>

  <p class="count" id="count" aria-live="polite"></p>
  <div id="grid"></div>
</main>
<script src="../../../js/courses-data.js"></script>
<script src="../../../js/script.js"></script>
<script>
(function () {
  var NOW = currentTerm();
  var TERMS = getVisibleTerms();
  var COURSES = getVisibleCourses();
  var term = 'all', type = 'all', q = '';
  var src = getCourseSource().sourceDate; if (src) document.getElementById('srcDate').textContent = src;

  var termBox = document.getElementById('terms');
  termBox.innerHTML = '<button class="chip" type="button" data-term="all" aria-pressed="true">전체 학기</button>' + TERMS.map(function (t) {
    return '<button class="chip' + (t < NOW ? ' past' : '') + '" type="button" data-term="' + t + '">' + t + (t === NOW ? '<i class="now-dot" title="이번 학기"></i>' : '') + '</button>';
  }).join('');

  var ORDER = ['1학년', '2학년', '3학년', '4학년', '공대공통과목', '타과수강전선', '교양', '대학원'];
  function termText(o, first) {
    var cls = (o[0] === term ? 'on' : '') + (first && term === 'all' ? ' next' : '');
    var joint = o[1].indexOf('연합전공') >= 0 ? '<small title="연합전공">연합</small>' : '';
    return '<span class="t ' + cls + '"' + (o[0] === NOW ? ' title="이번 학기"' : '') + '>' + o[0] + joint + '</span>';
  }
  function card(c) {
    var b = c.type === '전필' ? '<span class="badge req">전공필수</span>' : c.type === '전선' ? '<span class="badge">전공선택</span>' : c.type ? '<span class="badge">' + c.type + '</span>' : '';
    var up = c.offerings.filter(function (o) { return o[0] >= NOW; });
    var past = c.offerings.filter(function (o) { return o[0] < NOW; });
    var firstNext = up.findIndex(function (o) { return o[0] > NOW; });
    var rows = '<div><dt>예정</dt><dd>' + (up.length ? up.map(function (o, i) { return termText(o, i === firstNext); }).join('') : '<span class="none">예정 없음</span>') + '</dd></div>';
    if (past.length) rows += '<div class="past"><dt>지난</dt><dd>' + past.map(function (o) { return termText(o, false); }).join('') + '</dd></div>';
    return '<article class="ccard"><header><h3>' + c.name + '</h3>' + b + '</header><dl>' + rows + '</dl></article>';
  }
  function render() {
    var list = COURSES.filter(function (c) {
      if (type === '대학원' && c.category !== '대학원') return false;
      if (type !== 'all' && type !== '대학원' && c.type !== type) return false;
      if (term !== 'all' && !c.offerings.some(function (o) { return o[0] === term; })) return false;
      if (q) {
        var hay = (c.category + ' ' + c.name + ' ' + c.type + ' ' + c.offerings.map(function (o) { return o.join(' '); }).join(' ')).toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    });
    document.getElementById('count').textContent = (term === 'all' ? '' : term + '학기 개설 · ') + list.length + '개 과목';
    var html = ORDER.map(function (cat) {
      var g = list.filter(function (c) { return c.category === cat; });
      return g.length ? '<section class="cgroup"><h2>' + cat + '<span>' + g.length + '</span></h2><div class="cgrid">' + g.map(card).join('') + '</div></section>' : '';
    }).join('');
    document.getElementById('grid').innerHTML = html || '<p class="empty">조건에 맞는 과목이 없습니다. 학기나 구분을 바꿔 보세요.</p>';
  }
  function bind(box, attr, set) {
    box.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      box.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
      b.setAttribute('aria-pressed', 'true'); set(b.dataset[attr]); render();
    });
  }
  bind(termBox, 'term', function (v) { term = v; });
  bind(document.getElementById('types'), 't', function (v) { type = v; });
  document.getElementById('q').addEventListener('input', function (e) { q = e.target.value.trim().toLowerCase(); render(); });
  render();
})();
</script>
<footer class="foot"><span>학생이 정리한 비공식 안내입니다. 최종 기준은 학과 공식 자료를 따릅니다. (자료 확인 2026-10-27)</span><a href="https://ie.snu.ac.kr/" target="_blank" rel="noreferrer">산업공학과 공식 홈페이지</a></footer>
